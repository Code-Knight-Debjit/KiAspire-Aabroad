<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Ki Aspire Abroad</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="admin-body">

<div class="login-shell">
  <div class="login-card">
    <div class="login-logo"><img src="../Logo.webp" alt="Ki Aspire Abroad"></div>
    <h1 class="login-title">Admin Sign In</h1>
    <p class="login-sub">Staff access only.</p>

    <div class="form-status" id="formStatus"></div>

    <form id="loginForm" novalidate>
      <div class="form-field" id="fieldEmail">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="you@kiaspireabroad.com" required>
        <span class="form-error">Please enter a valid email address.</span>
      </div>
      <div class="form-field" id="fieldPassword">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
        <span class="form-error">Please enter your password.</span>
      </div>
      <button type="submit" class="btn btn-dark" id="submitBtn">Sign In</button>
    </form>

    <a href="../index.html" class="login-back">← Back to the main site</a>
  </div>
</div>

<script src="../api.js"></script>
<script>
(function(){
  // Already signed in? Skip straight to the dashboard.
  if(window.KiAspireAPI && window.KiAspireAPI.isLoggedIn()){
    window.location.href = 'dashboard.html';
  }

  var form = document.getElementById('loginForm');
  var statusEl = document.getElementById('formStatus');
  var submitBtn = document.getElementById('submitBtn');
  var emailField = document.getElementById('fieldEmail');
  var passwordField = document.getElementById('fieldPassword');

  document.getElementById('email').addEventListener('input', function(){ emailField.classList.remove('has-error'); });
  document.getElementById('password').addEventListener('input', function(){ passwordField.classList.remove('has-error'); });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    statusEl.className = 'form-status';

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    var ok = true;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ emailField.classList.add('has-error'); ok = false; }
    if(!password){ passwordField.classList.add('has-error'); ok = false; }
    if(!ok) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    window.KiAspireAPI.adminLogin(email, password)
      .then(function(){
        window.location.href = 'dashboard.html';
      })
      .catch(function(err){
        console.error('adminLogin failed:', err);
        statusEl.className = 'form-status is-visible is-error';
        statusEl.textContent = (err && err.status === 401)
          ? 'Incorrect email or password.'
          : ((err && err.message) || 'Something went wrong. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      });
  });
})();
</script>
</body>
</html>
