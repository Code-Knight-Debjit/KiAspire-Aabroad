# Render Blueprint for dev/staging hosting of this app.
#
# The production deployment target remains HostingRaja/cPanel per
# CLAUDE.md — this file exists purely to make spinning up a throwaway or
# dev instance on Render fast and repeatable. See DEPLOY-RENDER.md for the
# full walkthrough (import steps, env var values, migration caveats).
#
# This does NOT provision a database — an existing Render Postgres
# instance is assumed (DATABASE_URL is filled in manually in the
# dashboard) so importing this blueprint never creates a second database
# alongside one you already have.
services:
  - type: web
    name: kiaspire-aabroad-dev
    runtime: node
    plan: free
    branch: dev
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    # No preDeployCommand here — Render's Blueprint validator rejects it
    # outright on the free plan (not just skips it; the whole blueprint
    # import fails). Run `npm run migrate` / `npm run seed` locally against
    # DATABASE_URL instead — see DEPLOY-RENDER.md. Free-tier services also
    # don't get Shell/SSH access, so that's not a fallback here either.
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
